function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function formatDuration(sec){var m=Math.floor(sec/60),s=sec%60;return m+'鍒?+s+'绉?}
function getQ(id){return QUESTIONS.find(function(q){return q.id===id})}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

function startPractice(type){
var questionIds=[];
if(type==='mixed'){questionIds=QUESTIONS.map(function(q){return q.id})}
else if(type==='error'){var eb=load('error_book',[]);questionIds=eb.filter(function(e){return e.isActive}).map(function(e){return e.questionId})}
else{questionIds=QUESTIONS.filter(function(q){return q.type===type}).map(function(q){return q.id})}
if(questionIds.length===0){showToast('娌℃湁棰樼洰');return}
if(settings.shuffleQ)questionIds=shuffle(questionIds);
var shuffledOptions={};
if(settings.shuffleO){
questionIds.forEach(function(qid){
var q=getQ(qid);if(q.options&&q.options.length>1){
var indices=shuffle(q.options.map(function(_,i){return i}));
shuffledOptions[qid]=indices;
}
});
}
practiceState={type:type,questionIds:questionIds,shuffledOptions:shuffledOptions,currentIndex:0,results:[],startTime:Date.now(),isErrorPractice:type==='error'};
navigate('quiz');
renderQuiz();
}

q.type==='multiple'?result.userAnswer.includes(optText):result.userAnswer===optText
);

if(q.type==='multiple'){
if(q.answer.includes(optText))cls+=' correct';

}

var selectedOptions={};
function selectOption(displayIdx){
var q=getQ(practiceState.questionIds[practiceState.currentIndex]);
if(q.type==='multiple'){
if(!selectedOptions[practiceState.currentIndex])selectedOptions[practiceState.currentIndex]=[];
var arr=selectedOptions[practiceState.currentIndex];
var pos=arr.indexOf(displayIdx);
if(pos>=0)arr.splice(pos,1);else arr.push(displayIdx);
}else{selectedOptions[practiceState.currentIndex]=displayIdx}
renderQuiz();
}

function submitQuizAnswer(){
var q=getQ(practiceState.questionIds[practiceState.currentIndex]);
var result={questionId:q.id,usedHint:false};
if(q.type==='short'){
var input=document.getElementById('answer-input');
if(!input.value.trim()){showToast('璇疯緭鍏ョ瓟妗堝悗鍐嶆彁浜?);return}
result.userAnswer=input.value.trim();
result.usedHint=!!document.querySelector('#hint-area .hint-box');
result.isCorrect=null;result.score=null;result.aiFeedback=null;
practiceState.results[practiceState.currentIndex]=result;
if(settings.apiUrl&&settings.apiKey){
scoreShortAnswerWithAI(q,result.userAnswer,practiceState.currentIndex);
}else{
showSelfEval(practiceState.currentIndex);
}
}else{
var sel=selectedOptions[practiceState.currentIndex];
if(sel===undefined||(Array.isArray(sel)&&sel.length===0)){showToast('璇烽€夋嫨绛旀鍚庡啀鎻愪氦');return}
var shuffledOpt=practiceState.shuffledOptions[q.id];
var userAnswer;
if(q.type==='multiple'){
var arr=sel;
userAnswer=arr.map(function(displayIdx){return shuffledOpt?q.options[shuffledOpt[displayIdx]]:q.options[displayIdx]});
}else{
userAnswer=shuffledOpt?q.options[shuffledOpt[sel]]:q.options[sel];
}
result.userAnswer=userAnswer;
if(q.type==='multiple'){
result.isCorrect=arraysEqual(userAnswer.sort(),q.answer.slice().sort());
}else{
result.isCorrect=userAnswer===q.answer;
}
result.score=result.isCorrect?q.score:0;
practiceState.results[practiceState.currentIndex]=result;
if(!result.isCorrect)addToErrorBook(q.id,'auto');
renderQuiz();
}
}

function arraysEqual(a,b){if(a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true}

function showHint(qid){
var q=getQ(qid);
var sentences=q.answer.split('銆?);
var hint=sentences.slice(0,2).join('銆?)+'銆?;
document.getElementById('hint-area').innerHTML='<div class="hint-box">馃挕 '+hint+'</div>';

if(!result){practiceState.results[practiceState.currentIndex]={questionId:qid,usedHint:true,userAnswer:'',isCorrect:undefined,score:0,aiFeedback:''}}
else result.usedHint=true;
}

function finishPractice_(){
var total=practiceState.questionIds.length;
var correct=0,errors=0;
practiceState.results.forEach(function(r){
if(r.isCorrect===true)correct++;
else if(r.isCorrect===false)errors++;
});
var accuracy=total>0?Math.round((correct+errors>0?correct/(correct+errors)*100:0)):0;
var duration=Math.round((Date.now()-practiceState.startTime)/1000);
var record={id:'PR'+Date.now(),date:new Date().toISOString(),type:practiceState.type,totalQuestions:total,correctCount:correct,errorCount:errors,accuracyRate:accuracy,duration:duration,details:practiceState.results};
var records=load('practice_records',[]);records.push(record);save('practice_records',records);
// Update error book for error practice
if(practiceState.isErrorPractice){
practiceState.results.forEach(function(r){
if(r.isCorrect===true)updateErrorBookCorrect(r.questionId);
else if(r.isCorrect===false)resetErrorBookCorrect(r.questionId);
});
}
practiceState=null;selectedOptions={};
navigate('practice-result');
renderPracticeResult(record);
}

// ===== Error Book =====
function addToErrorBook(qid,source){
var eb=load('error_book',[]);
var existing=eb.find(function(e){return e.questionId===qid&&e.isActive});
if(existing)return;
var existingInactive=eb.find(function(e){return e.questionId===qid&&!e.isActive});
if(existingInactive){existingInactive.isActive=true;existingInactive.source=source;existingInactive.consecutiveCorrect=0;existingInactive.addedDate=new Date().toISOString()}
else{eb.push({questionId:qid,addedDate:new Date().toISOString(),source:source,consecutiveCorrect:0,isActive:true})}
save('error_book',eb);
}
function updateErrorBookCorrect(qid){
var eb=load('error_book',[]);var e=eb.find(function(x){return x.questionId===qid&&x.isActive});
if(e){e.consecutiveCorrect++;if(e.consecutiveCorrect>=2){e.isActive=false;showToast('璇ラ宸叉帉鎻★紝绉诲嚭閿欓鏈?)}}
save('error_book',eb);
}
function resetErrorBookCorrect(qid){
var eb=load('error_book',[]);var e=eb.find(function(x){return x.questionId===qid&&x.isActive});
if(e){e.consecutiveCorrect=0}save('error_book',eb);
}

// ===== Exam =====
function startExam(){
var questionIds=QUESTIONS.filter(function(q){return !q.pred}).map(function(q){return q.id});
// Group by type, shuffle within type
var groups={single:[],multiple:[],truefalse:[],short:[]};
questionIds.forEach(function(id){var q=getQ(id);groups[q.type].push(id)});
Object.keys(groups).forEach(function(t){if(settings.shuffleQ)groups[t]=shuffle(groups[t])});
questionIds=[].concat(groups.single,groups.multiple,groups.truefalse,groups.short);
var shuffledOptions={};
if(settings.shuffleO){
questionIds.forEach(function(qid){
var q=getQ(qid);if(q.options&&q.options.length>1){
shuffledOptions[qid]=shuffle(q.options.map(function(_,i){return i}));
}
});
}
examState={questionIds:questionIds,shuffledOptions:shuffledOptions,currentIndex:0,answers:{},startTime:Date.now(),duration:7200};
navigate('exam-quiz');
renderExam();
startExamTimer();
}

function startExamTimer(){
if(examTimer)clearInterval(examTimer);
examTimer=setInterval(function(){
var remaining=Math.round(examState.duration-(Date.now()-examState.startTime)/1000);
if(remaining<=0){clearInterval(examTimer);submitExam();return}
var timerEl=document.getElementById('exam-timer');
timerEl.textContent=formatTime(remaining);
if(remaining<=600)timerEl.classList.add('warning');
},1000);
}

async function submitExam(){

showModal('<h3>姝ｅ湪鍒ゅ垎</h3><p><div class="loading"></div> 璇风◢鍊?..</p>');

else if(settings.apiUrl&&settings.apiKey){
try{
var resp=await fetch(settings.apiUrl+'/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},
body:JSON.stringify({model:settings.model||'gpt-4o-mini',messages:[
{role:'system',content:'浣犳槸涓€浣嶈€冭瘯璇勫垎鑰佸笀銆傝鏍规嵁棰樼洰鍜屽弬鑰冪瓟妗堬紝瀵瑰鐢熺殑浣滅瓟杩涜瀹㈣璇勫垎銆傛弧鍒?鍒嗭紝杩斿洖JSON鏍煎紡锛歿"score":鍒嗘暟,"feedback":"涓€鍙ヨ瘽璇勪环"}銆傚彧杩斿洖JSON銆?},
{role:'user',content:'棰樼洰锛?+q.stem+'\n鍙傝€冪瓟妗堬細'+q.answer+'\n瀛︾敓浣滅瓟锛?+ans+'\n璇疯瘎鍒嗐€?}
],temperature:0.3})
});
var data=await resp.json();var text=data.choices[0].message.content;
var m=text.match(/\{[\s\S]*\}/);
if(m){var p=JSON.parse(m[0]);result.score=p.score;result.isCorrect=p.score>=3;result.aiFeedback=p.feedback}
else{result.score=0;result.isCorrect=false;result.aiFeedback='鍒ゅ垎澶辫触'}
}catch(e){result.score=0;result.isCorrect=false;result.aiFeedback='鍒ゅ垎澶辫触锛?+e.message}
}else{result.score=0;result.isCorrect=false;result.aiFeedback='鏈厤缃瓵PI锛岃鑷瘎'}
}else if(ans){
if(q.type==='multiple'){result.isCorrect=arraysEqual(ans.slice().sort(),q.answer.slice().sort())}
else{result.isCorrect=ans===q.answer}
result.score=result.isCorrect?q.score:0;
}else{result.score=0;result.isCorrect=false}
if(result.isCorrect)correctCount++;else errorCount++;
scoreByType[q.type]+=result.score;
if(!result.isCorrect)addToErrorBook(q.id,'auto');
results.push(result);
}
var totalScore=Math.round(Object.keys(scoreByType).reduce(function(s,k){return s+scoreByType[k]},0)*10)/10;

var records=load('exam_records',[]);records.push(record);save('exam_records',records);
examState=null;hideModal();

function drawTrendChart(canvasId,data,unit,color){
var canvas=document.getElementById(canvasId);if(!canvas)return;
var ctx=canvas.getContext('2d');
var w=canvas.width,h=canvas.height,padding=30;
ctx.clearRect(0,0,w,h);
var max=unit==='%'?100:100;var min=0;
// Grid lines
ctx.strokeStyle='#eef2f7';ctx.lineWidth=1;
for(var i=0;i<=4;i++){var y=padding+(h-padding*2)/4*i;ctx.beginPath();ctx.moveTo(padding,y);ctx.lineTo(w-padding,y);ctx.stroke()}
// Data line
if(data.length>1){
ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
data.forEach(function(v,i){var x=padding+(w-padding*2)/(data.length-1)*i;var y=h-padding-(h-padding*2)*v/max;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});
ctx.stroke();
// Points
ctx.fillStyle=color;data.forEach(function(v,i){var x=padding+(w-padding*2)/(data.length-1)*i;var y=h-padding-(h-padding*2)*v/max;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()});
// Labels
ctx.fillStyle='#7a8a9a';ctx.font='11px sans-serif';ctx.textAlign='center';
data.forEach(function(v,i){var x=padding+(w-padding*2)/(data.length-1)*i;var y=h-padding-(h-padding*2)*v/max;ctx.fillText(v+unit,x,y-8)});
}
// Axis labels
ctx.fillStyle='#7a8a9a';ctx.font='11px sans-serif';ctx.textAlign='right';
ctx.fillText(max+unit,padding-4,padding+4);ctx.fillText('0',padding-4,h-padding+4);
}
